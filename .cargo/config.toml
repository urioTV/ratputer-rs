[build]
target = "xtensa-esp32s3-none-elf"  # esp fork: the triple omits "unknown"

# `cargo run` / `cargo flash` flashes the firmware via espflash (USB-C cable)
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-nostartfiles",    # Xtensa fork: no crt0 from GCC
  "-C", "link-arg=-Tlinkall.x",      # esp-hal section layout (ld/esp32s3 via -L OUT_DIR)
  # device.x (interrupt handler aliases from the PAC) goes from the esp32s3 PAC build.rs — don't add it manually!
]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["core", "alloc"]  # alloc: esp-alloc (heap) — required by Slint
