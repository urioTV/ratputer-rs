[package]
name = "ratputer-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust firmware for the M5Stack Cardputer ADV (ESP32-S3)"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"

[dependencies]
# HAL (no_std, bare-metal) — ESP32-S3 = Xtensa
esp-hal = { version = "1.2", features = ["esp32s3", "unstable"] }  # unstable: delay module
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }  # app descriptor (required for merged .bin)
log = "0.4"

# Wi-Fi radio and its bare-metal scheduler
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "log-04"] }
# `embassy`: esp-rtos provides the embassy-time driver used by embassy-net timers
esp-rtos = { version = "0.4", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy"] }
embassy-futures = "0.1"
embassy-usb = { version = "0.6", default-features = false, features = [
    "log",
    "max-handler-count-1",
    "max-interface-count-1",
] }

# IPv4 stack over the Wi-Fi station interface: DHCP + DNS + UDP (SNTP clock sync)
embassy-net = { version = "0.8", features = ["proto-ipv4", "medium-ethernet", "dhcpv4", "dns", "udp", "log"] }
embassy-time = "0.5"
# REQUIRED: without a generic queue, esp-rtos uses the executor-integrated timer queue,
# which panics ("Found waker not created by the Embassy executor") on the first
# embassy-time timer, because we poll the stack with a no-op waker and no executor.
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-16"] }
nb = "1"                        # non-blocking ADC reads (esp-hal oneshot API)

# SD-card credential storage and TOML serialization (all no_std + alloc)
embedded-sdmmc = { version = "0.10", default-features = false, features = ["log"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
toml = { version = "0.9", default-features = false, features = ["display", "parse", "serde"] }

# Complete Cardputer ADV keyboard matrix/Fn-layer decoder
cardputer-adv-keyboard = "0.2.6"

# Display graphics
embedded-graphics = "0.8"
mipidsi = "0.9"                # ST7789 driver (built-in SpiInterface)
embedded-hal = "1.0"
embedded-hal-bus = "0.3"       # SpiDevice (ExclusiveDevice) on top of esp-hal

# Slint (no_std MCU): software RGB565 renderer – no threads (single-core)
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

# Heap in internal SRAM (the ADV has no PSRAM!) — required by Slint (alloc)
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-rom-sys = "0.1"             # ROM symbols (libc-ish) — kept defensively

[build-dependencies]
# .slint -> Rust compiler; fonts are packed from ui/fonts into the image
slint-build = "1.18"

[profile.dev]
opt-level = "z"
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
